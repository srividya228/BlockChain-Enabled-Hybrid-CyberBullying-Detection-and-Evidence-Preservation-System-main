<!DOCTYPE html>
<html>
<head>
<title>InstaSafe - Chat</title>
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

<h2 class="top-title">Chats</h2>

<div class="feed">

<div class="post">
<form method="POST">
<input type="text" name="message" placeholder="Type message..." required>
<button type="submit">Send</button>
</form>
</div>

{% for msg in messages %}
<div class="post">
<b>{{ msg[1] }}</b>
<p>{{ msg[2] }}</p>
</div>
{% endfor %}

</div>

<div class="navbar">
<a href="/home">🏠</a>
<a href="/reels">🎬</a>
<a href="/chat">💬</a>
<a href="/profile">👤</a>
</div>

</body>
</html>
